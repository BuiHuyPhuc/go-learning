version: '3.7'

services:
  master:
    image: redis:7
    container_name: redis-master
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    restart: always

  slave1:
    image: redis:7
    container_name: redis-slave1
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes --slaveof redis-master 6379
    restart: always

  slave2:
    image: redis:7
    container_name: redis-slave2
    ports:
      - "6381:6379"
    command: redis-server --appendonly yes --slaveof redis-master 6379
    restart: always
