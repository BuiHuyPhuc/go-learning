basePath: /api/v1
definitions:
  dto.LoginRequest:
    properties:
      user_account:
        type: string
      user_password:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      verify_key:
        type: string
      verify_purpose:
        type: string
      verify_type:
        type: integer
    type: object
  dto.SetupTwoFactorAuthRequest:
    properties:
      two_factor_auth_type:
        type: string
      two_factor_email:
        type: string
      user_id:
        type: integer
    type: object
  dto.UpdatePasswordRegisterRequest:
    properties:
      password:
        type: string
      token:
        type: string
    type: object
  dto.VerifyOTPRequest:
    properties:
      verify_code:
        type: string
      verify_key:
        type: string
    type: object
  dto.VerifyTwoFactorAuthRequest:
    properties:
      two_factor_code:
        type: string
      user_id:
        type: integer
    type: object
  response.ErrorResponseData:
    properties:
      detail: {}
      error:
        type: string
      internal_code:
        type: integer
    type: object
  response.ResponseData:
    properties:
      data: {}
      internal_code:
        type: integer
      message:
        type: string
    type: object
host: localhost:8888
